name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: milkdairy_test
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dev -d milkdairy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dev:devpass@localhost:5432/milkdairy_test
      DATABASE_URL_SYNC: postgresql+psycopg2://dev:devpass@localhost:5432/milkdairy_test
      JWT_SECRET_KEY: ci-test-secret
      ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports || true
      - name: Run migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check & build
        run: npm run build
      - name: Unit tests
        run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t kshirsagar-dairy-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t kshirsagar-dairy-frontend:ci --target production ./frontend
