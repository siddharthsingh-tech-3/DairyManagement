# Local development overrides: hot-reload backend & Vite dev server instead of
# the production nginx-served build. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  backend:
    entrypoint: ["./entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  frontend:
    build:
      context: ./frontend
      target: development
    ports: ["5173:5173"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

  nginx:
    profiles: ["proxy-disabled-in-dev"]
